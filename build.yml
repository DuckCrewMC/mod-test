name: Build mod jar
on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.7.1
      - run: gradle build
      # keep only the real mod jar (no -sources / -dev jars)
      - run: rm -f build/libs/*-sources.jar build/libs/*-dev.jar build/libs/*-javadoc.jar
      - uses: actions/upload-artifact@v4
        with:
          name: cosmetic-loader-jar
          path: build/libs/*.jar
      # Publishes the jar as a direct download under the repo's "Releases" page
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Cosmetic Loader (latest build)
          body: Download the .jar below and put it in your mods folder with Fabric API.
          files: build/libs/*.jar
          make_latest: true
